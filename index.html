<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Palavra & Notas</title>
  <meta name="description" content="Bíblia bilíngue (Português/Inglês) offline e anotações de sermões e cultos.">
  <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Palavra & Notas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- NOTAS -->
    <section class="view" id="view-notes" hidden>
      <header class="topbar">
        <h1>Notas</h1>
        <button class="icon-btn" id="notes-search-btn" aria-label="Pesquisar nas notas" data-icon="search"></button>
      </header>
      <div class="filter-row" id="notes-filter"></div>
      <main class="notes-list" id="notes-list"></main>
      <button class="fab" id="new-note-btn"><span data-icon="edit"></span>Nova nota</button>
    </section>

    <!-- EDITOR -->
    <section class="view" id="view-editor" hidden>
      <header class="topbar">
        <button class="icon-btn" id="editor-back" aria-label="Voltar" data-icon="back"></button>
        <span class="spacer"></span>
        <button class="icon-btn" id="rec-btn" aria-label="Gravar áudio" data-icon="mic"></button>
        <button class="icon-btn" id="note-share" aria-label="Exportar" data-icon="share"></button>
        <button class="icon-btn" id="note-delete" aria-label="Excluir nota" data-icon="trash"></button>
      </header>
      <div class="rec-live-bar" id="rec-live" hidden></div>
      <main class="editor" id="editor"></main>
    </section>

    <!-- BÍBLIA -->
    <section class="view" id="view-bible" hidden>
      <header class="topbar">
        <button class="ref-btn" id="ref-btn" aria-label="Escolher livro e capítulo"><span id="ref-label">João 3</span><span data-icon="down"></span></button>
        <span class="spacer"></span>
        <button class="chip outline" id="layout-btn" aria-label="Modo de leitura">PT · EN</button>
        <button class="icon-btn" id="reading-btn" aria-label="Texto e versão" data-icon="type"></button>
      </header>
      <main class="reader" id="reader" aria-live="polite"></main>
      <nav class="chapter-nav">
        <button class="nav-btn" id="prev-ch" aria-label="Capítulo anterior" data-icon="left"></button>
        <button class="nav-btn" id="next-ch" aria-label="Próximo capítulo" data-icon="right"></button>
      </nav>
      <div class="selection-bar" id="selection-bar" hidden>
        <span id="sel-label"></span>
        <div class="sel-actions">
          <button class="hl-dot" data-color="yellow" aria-label="Marcar amarelo"></button>
          <button class="hl-dot" data-color="green" aria-label="Marcar verde"></button>
          <button class="hl-dot" data-color="blue" aria-label="Marcar azul"></button>
          <button class="hl-dot" data-color="pink" aria-label="Marcar rosa"></button>
          <button class="hl-dot none" data-color="" aria-label="Remover marcação" data-icon="close"></button>
          <button class="chip" id="sel-copy">Copiar</button>
          <button class="chip tonal" id="sel-note">Para nota</button>
        </div>
      </div>
    </section>

    <!-- PESQUISA -->
    <section class="view" id="view-search" hidden>
      <header class="topbar"><h1>Pesquisa</h1></header>
      <div class="search-tools">
        <label class="search-field"><span data-icon="search"></span>
          <input type="search" id="search-input" placeholder="amor, Jo 3:16, Psalm 23" autocomplete="off" enterkeyhint="search" aria-label="Pesquisar">
        </label>
        <div class="filter-row" id="search-scope"></div>
      </div>
      <main class="search-results" id="search-results"></main>
    </section>

    <!-- AJUSTES -->
    <section class="view" id="view-settings" hidden>
      <header class="topbar"><h1>Ajustes</h1></header>
      <main class="settings" id="settings"></main>
    </section>

    <nav class="tabbar" id="tabbar">
      <button data-tab="notes"><span class="ind" data-icon="notes"></span><span>Notas</span></button>
      <button data-tab="bible"><span class="ind" data-icon="book"></span><span>Bíblia</span></button>
      <button data-tab="search"><span class="ind" data-icon="search"></span><span>Pesquisa</span></button>
      <button data-tab="settings"><span class="ind" data-icon="settings"></span><span>Ajustes</span></button>
    </nav>
  </div>

  <!-- Barra de formatação (acima do teclado) -->
  <div class="fmt-bar" id="fmt-bar" hidden>
    <button data-cmd="bold" aria-label="Negrito" data-icon="bold"></button>
    <button data-cmd="italic" aria-label="Itálico" data-icon="italic"></button>
    <button data-cmd="insertUnorderedList" aria-label="Lista" data-icon="list"></button>
    <button data-cmd="insertOrderedList" aria-label="Lista numerada" data-icon="listnum"></button>
    <button data-cmd="heading" aria-label="Título de seção" data-icon="heading"></button>
    <button class="fmt-bible" data-cmd="bible"><span data-icon="bookplus"></span>Inserir Bíblia</button>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <button class="rec-pill" id="rec-pill" hidden aria-label="Gravação em andamento — voltar para a nota"><span class="rec-dot"></span><span data-rec-time>0:00</span> Gravando</button>
  <article id="print-area" aria-hidden="true"></article>

  <script src="js/books.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
