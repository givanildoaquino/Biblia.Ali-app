<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Palavra & Notas</title>
  <meta name="description" content="Bíblia bilíngue (Português/Inglês) offline e anotações de sermões e cultos.">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Palavra & Notas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <!-- BÍBLIA -->
    <section class="view" id="view-bible" data-view="bible">
      <header class="topbar">
        <button class="ref-btn" id="ref-btn" aria-label="Escolher livro e capítulo"><span id="ref-label">Gênesis 1</span> <span class="caret">▾</span></button>
        <div class="topbar-actions">
          <button class="icon-btn" id="layout-btn" aria-label="Modo de leitura" title="Modo de leitura"></button>
          <button class="icon-btn" id="settings-btn" aria-label="Ajustes" title="Ajustes">
            <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          </button>
        </div>
      </header>
      <div class="version-bar" id="version-bar"></div>
      <main class="reader" id="reader" aria-live="polite"></main>
      <nav class="chapter-nav">
        <button class="nav-btn" id="prev-ch" aria-label="Capítulo anterior">‹</button>
        <button class="nav-btn" id="next-ch" aria-label="Próximo capítulo">›</button>
      </nav>
      <div class="selection-bar" id="selection-bar" hidden>
        <span id="sel-label"></span>
        <div class="sel-actions">
          <button class="hl-dot" data-color="yellow" aria-label="Marcar amarelo"></button>
          <button class="hl-dot" data-color="green" aria-label="Marcar verde"></button>
          <button class="hl-dot" data-color="blue" aria-label="Marcar azul"></button>
          <button class="hl-dot" data-color="pink" aria-label="Marcar rosa"></button>
          <button class="hl-dot none" data-color="" aria-label="Remover marcação">✕</button>
          <button class="chip" id="sel-copy">Copiar</button>
          <button class="chip primary" id="sel-note">+ Anotação</button>
        </div>
      </div>
    </section>

    <!-- ANOTAÇÕES -->
    <section class="view" id="view-notes" data-view="notes" hidden>
      <header class="topbar">
        <h1>Anotações</h1>
        <div class="topbar-actions">
          <button class="chip primary" id="new-note-btn">+ Nova</button>
        </div>
      </header>
      <div class="notes-tools">
        <input type="search" id="notes-search" placeholder="Buscar em títulos, tópicos, pregador..." autocomplete="off">
        <div class="filter-row" id="notes-filter"></div>
      </div>
      <main class="notes-list" id="notes-list"></main>
    </section>

    <!-- EDITOR DE ANOTAÇÃO -->
    <section class="view" id="view-editor" data-view="editor" hidden>
      <header class="topbar">
        <button class="icon-btn back" id="editor-back" aria-label="Voltar">‹</button>
        <h1 id="editor-title">Anotação</h1>
        <div class="topbar-actions">
          <button class="chip" id="note-share">Compartilhar</button>
          <button class="icon-btn danger" id="note-delete" aria-label="Excluir anotação" title="Excluir">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          </button>
        </div>
      </header>
      <main class="editor" id="editor"></main>
    </section>

    <!-- BUSCA -->
    <section class="view" id="view-search" data-view="search" hidden>
      <header class="topbar"><h1>Buscar</h1></header>
      <div class="notes-tools">
        <input type="search" id="search-input" placeholder="Palavra ou referência (ex.: amor, Jo 3:16, Psalm 23)" autocomplete="off" enterkeyhint="search">
        <div class="filter-row" id="search-scope"></div>
      </div>
      <main class="search-results" id="search-results"></main>
    </section>

    <nav class="tabbar" id="tabbar">
      <button data-tab="bible" class="active">
        <svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M12 6v7M9.5 8.5h5"/></svg>
        <span>Bíblia</span>
      </button>
      <button data-tab="notes">
        <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
        <span>Anotações</span>
      </button>
      <button data-tab="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Buscar</span>
      </button>
    </nav>
  </div>

  <!-- Folhas (bottom sheets) -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <button class="rec-pill" id="rec-pill" hidden aria-label="Gravação em andamento — voltar para a anotação"><span class="rec-dot"></span><span data-rec-time>0:00</span> Gravando</button>

  <script src="js/books.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
